name: management

# HTTP frontend on host port 80. API and PostgreSQL stay on the compose network.
# COOKIE_SECURE=false is required for plain HTTP; enable TLS before flipping it.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - control_api_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  control-api:
    image: control-api:local
    build: ../control-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LISTEN_ADDRESS: 0.0.0.0:8080
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  control-api-admin:
    image: control-api:local
    build: ../control-api
    profiles: ["bootstrap"]
    entrypoint: ["/control-api-admin"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    restart: "no"

  management-web:
    image: management-web:local
    build: ../management-web
    environment:
      CONTROL_API_ORIGIN: http://control-api:8080
      HOSTNAME: 0.0.0.0
      PORT: "3001"
    depends_on:
      - control-api
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - management-web
    restart: unless-stopped

volumes:
  control_api_pgdata:
