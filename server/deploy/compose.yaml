name: management

# HTTP frontend on host port 80. API and PostgreSQL stay on the compose network.
# COOKIE_SECURE=false is required for plain HTTP; enable TLS before flipping it.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - control_api_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  control-api:
    image: control-api:local
    build: ../control-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LISTEN_ADDRESS: 0.0.0.0:8080
      COOKIE_SECURE: "false"
      SETTINGS_MASTER_KEY: ${SETTINGS_MASTER_KEY}
      KNOWLEDGE_PROVIDER: ${KNOWLEDGE_PROVIDER:-local-pgvector}
      EMBEDDING_BASE_URL: http://embedding:80
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
    depends_on:
      postgres:
        condition: service_healthy
      embedding:
        condition: service_started
    restart: unless-stopped

  # Infinity serves /embeddings; nginx exposes /v1/embeddings for control-api.
  # Prefill BAAI/bge-m3 via ModelScope into embedding_model_cache when HF is unreachable.
  infinity-emb:
    image: michaelf34/infinity:latest-cpu
    command:
      [
        "v2",
        "--model-id",
        "/data/modelscope/models/BAAI--bge-m3/snapshots/master",
        "--port",
        "80",
        "--engine",
        "torch",
      ]
    volumes:
      - embedding_model_cache:/data
    mem_limit: 3g
    restart: unless-stopped

  embedding:
    image: nginx:1.27-alpine
    depends_on:
      - infinity-emb
    volumes:
      - ./embedding-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  control-api-admin:
    image: control-api:local
    build: ../control-api
    profiles: ["bootstrap"]
    entrypoint: ["/control-api-admin"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    restart: "no"

  # MCP service exposing user and session administration over Streamable HTTP.
  # Kept on the compose network; expose via TLS-terminating proxy if remote
  # MCP clients need access. Start with: docker compose --profile mcp up -d
  control-api-mcp:
    image: control-api:local
    build: ../control-api
    profiles: ["mcp"]
    entrypoint: ["/control-api-mcp"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MCP_LISTEN_ADDRESS: 0.0.0.0:8091
      MCP_ADMIN_TOKEN: ${MCP_ADMIN_TOKEN}
      MCP_ACTOR_USERNAME: ${MCP_ACTOR_USERNAME}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  management-web:
    image: management-web:local
    build: ../management-web
    environment:
      CONTROL_API_ORIGIN: http://control-api:8080
      HOSTNAME: 0.0.0.0
      PORT: "3001"
    depends_on:
      - control-api
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - management-web
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.9.6
    profiles: ["livekit"]
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped

  livekit-agent:
    image: livekit-agent:local
    build: ../livekit-agent
    profiles: ["livekit"]
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      STT_BASE_URL: ${LIVEKIT_ASR_BASE_URL:-}
      STT_API_KEY: ${LIVEKIT_ASR_API_KEY:-}
      STT_MODEL: ${LIVEKIT_ASR_MODEL:-whisper-1}
      STT_LANGUAGE: ${LIVEKIT_ASR_LANGUAGE:-zh}
    depends_on:
      - livekit
    restart: unless-stopped

volumes:
  control_api_pgdata:
  embedding_model_cache:
