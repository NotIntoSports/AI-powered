name: control-api

# Development-only loopback stack. Production must terminate TLS and set
# COOKIE_SECURE=true; do not publish these ports beyond 127.0.0.1.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - control_api_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  control-api:
    image: control-api:local
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LISTEN_ADDRESS: 0.0.0.0:8080
      COOKIE_SECURE: "false"
      SETTINGS_MASTER_KEY: ${SETTINGS_MASTER_KEY}
      KNOWLEDGE_PROVIDER: ${KNOWLEDGE_PROVIDER:-local-pgvector}
      EMBEDDING_BASE_URL: http://embedding:80
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
    depends_on:
      postgres:
        condition: service_healthy
      embedding:
        condition: service_started
    restart: unless-stopped

  infinity-emb:
    image: michaelf34/infinity:latest-cpu
    command:
      [
        "v2",
        "--model-id",
        "/data/modelscope/models/BAAI--bge-m3/snapshots/master",
        "--port",
        "80",
        "--engine",
        "torch",
      ]
    volumes:
      - embedding_model_cache:/data
    mem_limit: 3g
    restart: unless-stopped

  embedding:
    image: nginx:1.27-alpine
    depends_on:
      - infinity-emb
    volumes:
      - ../deploy/embedding-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  control-api-admin:
    image: control-api:local
    build: .
    profiles: ["bootstrap"]
    entrypoint: ["/control-api-admin"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: "no"

  management-web:
    image: management-web:local
    build:
      context: ../management-web
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      CONTROL_API_ORIGIN: http://control-api:8080
      HOSTNAME: 0.0.0.0
      PORT: "3001"
    depends_on:
      - control-api
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.9.6
    profiles: ["livekit"]
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    restart: unless-stopped

  livekit-agent:
    image: livekit-agent:local
    build:
      context: ../livekit-agent
    profiles: ["livekit"]
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      STT_BASE_URL: ${LIVEKIT_ASR_BASE_URL:-}
      STT_API_KEY: ${LIVEKIT_ASR_API_KEY:-}
      STT_MODEL: ${LIVEKIT_ASR_MODEL:-whisper-1}
      STT_LANGUAGE: ${LIVEKIT_ASR_LANGUAGE:-zh}
    depends_on:
      - livekit
    restart: unless-stopped

volumes:
  control_api_pgdata:
  embedding_model_cache:
