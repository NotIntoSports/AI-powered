name: control-api

# Development-only loopback stack. Production must terminate TLS and set
# COOKIE_SECURE=true; do not publish these ports beyond 127.0.0.1.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - control_api_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  control-api:
    image: control-api:local
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LISTEN_ADDRESS: 0.0.0.0:8080
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  control-api-admin:
    image: control-api:local
    build: .
    profiles: ["bootstrap"]
    entrypoint: ["/control-api-admin"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: "no"

volumes:
  control_api_pgdata:
