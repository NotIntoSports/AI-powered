openapi: 3.1.0
info:
  title: AI Interviewer Control API
  version: 0.2.0
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Control API is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated browser or desktop session.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: Browser purpose only; control_session with HttpOnly, Secure, SameSite=Strict, and Path=/.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/logout:
    post:
      operationId: logout
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '204':
          description: Current session revoked.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Current public user.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/admin/users:
    get:
      operationId: listAdminUsersPlaceholder
      summary: Reserved for Task 7.
      responses:
        '501':
          description: Not implemented.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
  /api/v1/admin/users/{userID}:
    parameters:
      - name: userID
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getAdminUserPlaceholder
      summary: Reserved for Task 7.
      responses:
        '501':
          description: Not implemented.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: control_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  responses:
    InvalidInput:
      description: Invalid input.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
    InvalidCredentials:
      description: Invalid username or password.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
    Unauthenticated:
      description: Authentication is required.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
    RequestTooLarge:
      description: Request body exceeds 32 KiB.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
    RateLimited:
      description: Too many login attempts.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
  schemas:
    APIError:
      type: object
      required: [code, message, requestId]
      properties:
        code: {type: string}
        message: {type: string}
        requestId:
          type: string
    User:
      type: object
      required: [id, username, role, status, createdAt, updatedAt]
      properties:
        id: {type: string}
        username: {type: string}
        role: {type: string, enum: [admin, operator]}
        status: {type: string, enum: [active, disabled, deleted]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        lastLoginAt: {type: string, format: date-time}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password, purpose]
      properties:
        username: {type: string}
        password: {type: string, format: password}
        purpose: {type: string, enum: [browser, desktop]}
        deviceId: {type: string}
    LoginResponse:
      type: object
      required: [user, expiresAt]
      properties:
        user: {$ref: '#/components/schemas/User'}
        accessToken:
          type: string
          description: Present only for desktop purpose.
        expiresAt: {type: string, format: date-time}
    HealthResponse:
      type: object
      required: [service, status]
      properties:
        service: {type: string, example: control-api}
        status: {type: string, example: ok}
