openapi: 3.1.0
info:
  title: AI Interviewer Control API
  version: 0.3.0
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Control API is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated browser or desktop session.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: Browser purpose only; control_session with HttpOnly, Secure, SameSite=Strict, and Path=/.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/logout:
    post:
      operationId: logout
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '204':
          description: Current session revoked.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Current public user.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/admin/users:
    get:
      operationId: listAdminUsers
      summary: List users ordered by creation time.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Public user records.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/User'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAdminUser
      summary: Create an administrator or operator. No default operator is seeded.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUserRequest'}
      responses:
        '201':
          description: Created public user.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/UsernameTaken'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/InvalidInputUnprocessable'
  /api/v1/admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    patch:
      operationId: patchAdminUser
      summary: Set user status to active or disabled. Disabling revokes every session.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatchUserRequest'}
      responses:
        '204':
          description: Status updated.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/LastAdminRequired'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/InvalidInputUnprocessable'
  /api/v1/admin/users/{id}/reset-password:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: resetAdminUserPassword
      summary: Replace a password and revoke every session for the target user.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '204':
          description: Password replaced and sessions revoked.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/InvalidInputUnprocessable'
  /api/v1/admin/users/{id}/revoke-sessions:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: revokeAdminUserSessions
      summary: Revoke sessions. preserveCurrent keeps the caller session only when the target is that administrator.
      security:
        - cookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevokeSessionsRequest'}
      responses:
        '204':
          description: Sessions revoked.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
  /api/v1/admin/sessions:
    get:
      operationId: listAdminSessions
      summary: List current unrevoked session lines and online state.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Active session lines.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SessionLine'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/devices:
    get:
      operationId: listAdminDevices
      summary: List registered client devices.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Devices.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Device'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/settings/ai:
    get:
      operationId: getAdminAISettings
      summary: Return public AI settings. Secrets are never included.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Public AI settings.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicAISettings'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: putAdminAISettings
      summary: Save AI settings. Empty apiKey keeps the stored key.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutAISettingsRequest'}
      responses:
        '200':
          description: Saved public AI settings.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicAISettings'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/InvalidInputUnprocessable'
        '503':
          $ref: '#/components/responses/SettingsUnavailable'
  /api/v1/admin/settings/ai/test:
    post:
      operationId: testAdminAISettings
      summary: Probe the configured or submitted OpenAI-compatible /models endpoint.
      security:
        - cookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutAISettingsRequest'}
      responses:
        '200':
          description: Probe result without upstream bodies or secrets.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AITestResult'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/InvalidInputUnprocessable'
  /api/v1/admin/settings/rtc:
    get:
      operationId: getAdminRTCSettings
      summary: Return public RTC settings. Secrets are never included.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Public RTC settings.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicRTCSettings'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: putAdminRTCSettings
      summary: Save RTC settings. Empty secret keeps the stored secret.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutRTCSettingsRequest'}
      responses:
        '200':
          description: Saved public RTC settings.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicRTCSettings'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/InvalidInputUnprocessable'
        '503':
          $ref: '#/components/responses/SettingsUnavailable'
  /api/v1/admin/settings/rtc/test:
    post:
      operationId: testAdminRTCSettings
      summary: Validate stored or submitted RTC settings without returning secrets.
      security:
        - cookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutRTCSettingsRequest'}
      responses:
        '200':
          description: Validation result.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RTCTestResult'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/InvalidInputUnprocessable'
  /api/v1/admin/settings/storage:
    get:
      operationId: getAdminStorageSettings
      summary: Return public Tencent COS settings. SecretKey is never included.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Public object storage settings.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicStorageSettings'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: putAdminStorageSettings
      summary: Save Tencent COS settings. Empty secretKey keeps the stored key.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutStorageSettingsRequest'}
      responses:
        '200':
          description: Saved public object storage settings.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicStorageSettings'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/InvalidInputUnprocessable'
        '503':
          $ref: '#/components/responses/SettingsUnavailable'
  /api/v1/admin/settings/storage/test:
    post:
      operationId: testAdminStorageSettings
      summary: List COS buckets with stored or submitted credentials. Secrets are never returned.
      security:
        - cookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutStorageSettingsRequest'}
      responses:
        '200':
          description: Probe result without secrets.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageTestResult'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/settings/speech:
    get:
      operationId: getAdminSpeechSettings
      summary: Return public speech settings for Doubao and Aliyun NLS. Secrets are never included.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Public speech settings.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicSpeechSettings'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: putAdminSpeechSettings
      summary: Save speech settings for the active provider. Empty secrets keep the stored values.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutSpeechSettingsRequest'}
      responses:
        '200':
          description: Saved public speech settings.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicSpeechSettings'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/InvalidInputUnprocessable'
        '503':
          $ref: '#/components/responses/SettingsUnavailable'
  /api/v1/admin/settings/speech/test:
    post:
      operationId: testAdminSpeechSettings
      summary: Probe speech authentication for Doubao or Aliyun without returning secrets.
      security:
        - cookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutSpeechSettingsRequest'}
      responses:
        '200':
          description: Probe result without secrets.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpeechTestResult'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/resumes:
    get:
      operationId: listAdminResumes
      summary: List uploaded resumes. Object contents are not returned.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Resume metadata.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Resume'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: uploadAdminResume
      summary: Upload a PDF or Word resume to Tencent COS.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                candidateName: {type: string}
                file: {type: string, format: binary}
      responses:
        '201':
          description: Stored resume metadata.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Resume'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/SettingsUnavailable'
  /api/v1/admin/resumes/{id}/download:
    get:
      operationId: downloadAdminResume
      summary: Return a short-lived COS download URL. The secret key is never included.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Presigned download URL.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: {type: string}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
  /api/v1/admin/resumes/{id}:
    delete:
      operationId: deleteAdminResume
      summary: Delete a resume object and its metadata. The secret key is never returned.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: Resume deleted.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
  /api/v1/admin/resumes/{id}/reindex:
    post:
      operationId: reindexAdminResume
      summary: Re-run knowledge indexing for a resume. Does not expose vectors or provider internals.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Resume metadata after the reindex job is queued.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Resume'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
  /api/v1/client/settings/ai:
    get:
      operationId: getClientAISettings
      summary: Return decrypted AI runtime settings for a desktop session. The key is not stored on the client disk.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Desktop runtime AI settings, including the API key for in-memory use.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientAISettings'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/SettingsUnavailable'
  /api/v1/client/settings/asr:
    get:
      operationId: getClientASRSettings
      summary: Return decrypted speech transcription settings for a desktop session. The key is not stored on the client disk.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Desktop runtime ASR settings, including the API key for in-memory use.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientASRSettings'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/SettingsUnavailable'
  /api/v1/client/settings/speech:
    get:
      operationId: getClientSpeechSettings
      summary: Return decrypted speech runtime settings for a desktop session. Secrets are not stored on the client disk.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Desktop runtime speech settings, including API key and access token for in-memory use.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientSpeechSettings'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/SettingsUnavailable'
    patch:
      operationId: patchClientSpeechSpeaker
      summary: Persist a cloned speaker_id from the desktop client. Does not accept secrets.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [speakerId]
              properties:
                speakerId: {type: string}
      responses:
        '200':
          description: Updated public speech settings.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicSpeechSettings'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidInputUnprocessable'
        '503':
          $ref: '#/components/responses/SettingsUnavailable'
  /api/v1/client/rtc/token:
    post:
      operationId: issueClientRTCToken
      summary: Issue a short-lived connection for the active RTC provider.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roomId, userId]
              properties:
                roomId: {type: string}
                userId: {type: string}
      responses:
        '200':
          description: Provider-specific connection. Token is single-use short lived.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RTCConnection'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/InvalidInputUnprocessable'
        '503':
          $ref: '#/components/responses/SettingsUnavailable'
  /api/v1/client/resumes:
    get:
      operationId: listClientResumes
      summary: List resumes uploaded by the current desktop user. Object contents are not returned.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Resume metadata for the current user.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Resume'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      operationId: uploadClientResume
      summary: Operator or administrator upload of a PDF or Word resume to Tencent COS.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                candidateName: {type: string}
                file: {type: string, format: binary}
      responses:
        '201':
          description: Stored resume metadata.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Resume'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '503':
          $ref: '#/components/responses/SettingsUnavailable'
  /api/v1/client/resumes/{id}/download:
    get:
      operationId: downloadClientResume
      summary: Return a short-lived COS download URL for a resume uploaded by the current user.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Presigned download URL.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: {type: string}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/UserNotFound'
  /api/v1/client/resumes/{id}:
    delete:
      operationId: deleteClientResume
      summary: Delete a resume uploaded by the current user so a replacement can be uploaded.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: Resume deleted.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/UserNotFound'
  /api/v1/client/resumes/{id}/status:
    get:
      operationId: getClientResumeIndexStatus
      summary: Return resume knowledge index status. Vectors and object keys are not returned.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Index status for the resume.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResumeIndexStatus'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/UserNotFound'
  /api/v1/client/knowledge/search:
    post:
      operationId: searchClientKnowledge
      summary: Search indexed resume chunks for interview follow-up. Failures return an empty list.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: {type: string, minLength: 1, maxLength: 2000}
                resumeId: {type: string, description: Legacy single material id; still accepted.}
                resumeIds:
                  type: array
                  maxItems: 20
                  items: {type: string}
                  description: Material ids to search across for this interaction.
                topK: {type: integer, minimum: 1, maximum: 10, default: 5}
      responses:
        '200':
          description: Matching chunks, or an empty list when indexing is incomplete or search fails.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeSearchResult'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/client/voice-samples:
    post:
      operationId: uploadClientVoiceSample
      summary: Upload a voice clone WAV sample to Tencent COS and return a ~30 minute presigned GET URL for Aliyun CosyVoice clone. COS secrets are never returned to the client.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, description: Mono 16bit WAV, 24kHz, 5-25 seconds, max 10MB.}
      responses:
        '201':
          description: Stored voice sample with short-lived presigned URL.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                required: [id, url, sizeBytes, expiresIn]
                properties:
                  id: {type: string, description: Sample id used for deletion.}
                  url: {type: string, description: Presigned GET URL readable by Aliyun for ~30 minutes.}
                  sizeBytes: {type: integer}
                  expiresIn: {type: integer, description: Presigned URL validity in seconds.}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/InvalidInputUnprocessable'
        '503':
          $ref: '#/components/responses/SettingsUnavailable'
  /api/v1/admin/settings/roles:
    get:
      operationId: getAssistantRoleProfiles
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Global assistant role copy and business instructions.
          content: {application/json: {schema: {$ref: '#/components/schemas/RoleProfiles'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      operationId: putAssistantRoleProfiles
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RoleProfilesInput'}}}
      responses:
        '200':
          description: All four role profiles saved atomically.
          content: {application/json: {schema: {$ref: '#/components/schemas/RoleProfiles'}}}
        '422': {$ref: '#/components/responses/InvalidInputUnprocessable'}
  /api/v1/client/settings/roles:
    get:
      operationId: getClientAssistantRoleProfiles
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Read-only assistant role profiles for desktop sessions.
          content: {application/json: {schema: {$ref: '#/components/schemas/RoleProfiles'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/client/voice-samples/{id}:
    delete:
      operationId: deleteClientVoiceSample
      summary: Delete a voice clone sample right after cloning so audio is not retained.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{32}$'}
      responses:
        '204':
          description: Sample deleted (or already absent).
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/InvalidInputUnprocessable'
        '503':
          $ref: '#/components/responses/SettingsUnavailable'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: control_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  responses:
    InvalidInput:
      description: Invalid input.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
    InvalidCredentials:
      description: Invalid username or password.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
    Unauthenticated:
      description: Authentication is required.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
          example: {code: UNAUTHENTICATED, message: authentication is required, requestId: request-id}
    RequestTooLarge:
      description: Request body exceeds 32 KiB.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
    RateLimited:
      description: Too many login attempts.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
    Forbidden:
      description: Administrator access is required.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
          example: {code: FORBIDDEN, message: administrator access is required, requestId: request-id}
    UsernameTaken:
      description: Username is already taken.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
          example: {code: USERNAME_TAKEN, message: username is already taken, requestId: request-id}
    LastAdminRequired:
      description: The last active administrator cannot be disabled.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
          example: {code: LAST_ADMIN_REQUIRED, message: the last active administrator cannot be disabled, requestId: request-id}
    CannotDisableSelf:
      description: The current administrator cannot disable their own account.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
          example: {code: CANNOT_DISABLE_SELF, message: cannot disable the current administrator, requestId: request-id}
    UserNotFound:
      description: User was not found.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
          example: {code: USER_NOT_FOUND, message: user was not found, requestId: request-id}
    InvalidInputUnprocessable:
      description: Role, status, username, password, or settings input is invalid.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
          example: {code: INVALID_INPUT, message: request body is invalid, requestId: request-id}
    SettingsUnavailable:
      description: Settings master key is missing or stored secrets cannot be decrypted.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
          example: {code: SETTINGS_KEY_MISSING, message: settings master key is not configured, requestId: request-id}
  schemas:
    AssistantRole:
      type: string
      enum: [hr, meeting_assistant, interviewer, candidate]
    RoleProfile:
      type: object
      required: [role, openingTemplate, closingTemplate, instructions, configVersion, updatedAt]
      properties:
        role: {$ref: '#/components/schemas/AssistantRole'}
        openingTemplate: {type: string, maxLength: 500}
        closingTemplate: {type: string, maxLength: 500}
        instructions: {type: string, maxLength: 4000}
        configVersion: {type: integer, minimum: 0}
        updatedAt: {type: string, format: date-time}
    RoleProfiles:
      type: object
      required: [roles]
      properties:
        roles: {type: array, minItems: 4, maxItems: 4, items: {$ref: '#/components/schemas/RoleProfile'}}
    RoleProfileInput:
      type: object
      required: [role, openingTemplate, closingTemplate, instructions]
      properties:
        role: {$ref: '#/components/schemas/AssistantRole'}
        openingTemplate: {type: string, maxLength: 500}
        closingTemplate: {type: string, maxLength: 500}
        instructions: {type: string, maxLength: 4000}
    RoleProfilesInput:
      type: object
      required: [roles]
      properties:
        roles: {type: array, minItems: 4, maxItems: 4, items: {$ref: '#/components/schemas/RoleProfileInput'}}
    APIError:
      type: object
      required: [code, message, requestId]
      properties:
        code: {type: string}
        message: {type: string}
        requestId:
          type: string
    User:
      type: object
      required: [id, username, role, status, createdAt, updatedAt]
      properties:
        id: {type: string}
        username: {type: string}
        role: {type: string, enum: [admin, operator]}
        status: {type: string, enum: [active, disabled, deleted]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        lastLoginAt: {type: string, format: date-time}
        online: {type: boolean}
        lastSeenAt: {type: string, format: date-time}
        activeSessionCount: {type: integer}
        voiceBound: {type: boolean, description: Whether the account has a bound Doubao speaker_id.}
        speakerId: {type: string, description: Bound speaker_id when voiceBound is true.}
        voiceBoundAt: {type: string, format: date-time, description: Last time the account voice binding was updated.}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password, purpose]
      properties:
        username: {type: string}
        password: {type: string, format: password}
        purpose: {type: string, enum: [browser, desktop]}
        deviceId: {type: string}
    LoginResponse:
      type: object
      required: [user, expiresAt]
      properties:
        user: {$ref: '#/components/schemas/User'}
        accessToken:
          type: string
          description: Present only for desktop purpose.
        expiresAt: {type: string, format: date-time}
    HealthResponse:
      type: object
      required: [service, status]
      properties:
        service: {type: string, example: control-api}
        status: {type: string, example: ok}
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, password, role]
      properties:
        username: {type: string}
        password: {type: string, format: password}
        role: {type: string, enum: [admin, operator]}
    PatchUserRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [active, disabled]}
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {type: string, format: password}
    RevokeSessionsRequest:
      type: object
      additionalProperties: false
      properties:
        preserveCurrent: {type: boolean}
    SessionLine:
      type: object
      required: [id, userId, username, purpose, createdAt, expiresAt, online]
      properties:
        id: {type: string}
        userId: {type: string}
        username: {type: string}
        purpose: {type: string, enum: [browser, desktop]}
        deviceId: {type: string}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        lastUsedAt: {type: string, format: date-time}
        online: {type: boolean}
    Device:
      type: object
      required: [id, userId, username, clientVersion, os, osVersion, lastSeenAt, disabled, online]
      properties:
        id: {type: string}
        userId: {type: string}
        username: {type: string}
        clientVersion: {type: string}
        os: {type: string}
        osVersion: {type: string}
        lastSeenAt: {type: string, format: date-time}
        disabled: {type: boolean}
        online: {type: boolean}
    PublicAISettings:
      type: object
      required: [configured, available, provider, baseUrl, model, enabled, apiKeyConfigured]
      properties:
        configured: {type: boolean}
        available: {type: boolean}
        provider: {type: string}
        baseUrl: {type: string}
        model: {type: string}
        questionTimeoutMs: {type: integer}
        reportTimeoutMs: {type: integer}
        enabled: {type: boolean}
        apiKeyConfigured: {type: boolean}
        localEndpoint: {type: boolean}
        configVersion: {type: integer}
        updatedAt: {type: string, format: date-time}
        updatedByUsername: {type: string}
    ClientAISettings:
      type: object
      required: [configured, available, provider, baseUrl, model, enabled, apiKeyConfigured]
      properties:
        configured: {type: boolean}
        available: {type: boolean}
        provider: {type: string}
        baseUrl: {type: string}
        model: {type: string}
        questionTimeoutMs: {type: integer}
        reportTimeoutMs: {type: integer}
        enabled: {type: boolean}
        apiKeyConfigured: {type: boolean}
        localEndpoint: {type: boolean}
        configVersion: {type: integer}
        updatedAt: {type: string, format: date-time}
        updatedByUsername: {type: string}
        apiKey: {type: string, format: password}
    ClientASRSettings:
      type: object
      required: [configured, available, baseUrl, model, language]
      properties:
        configured: {type: boolean}
        available: {type: boolean}
        baseUrl: {type: string}
        model: {type: string}
        language: {type: string}
        apiKey: {type: string, format: password}
        source: {type: string, enum: [asr, ai]}
    PutAISettingsRequest:
      type: object
      additionalProperties: false
      required: [baseUrl, model]
      properties:
        provider: {type: string}
        baseUrl: {type: string}
        model: {type: string}
        questionTimeoutMs: {type: integer}
        reportTimeoutMs: {type: integer}
        enabled: {type: boolean}
        apiKey: {type: string, format: password}
        clearApiKey: {type: boolean}
    AITestResult:
      type: object
      required: [reachable, modelFound, message]
      properties:
        reachable: {type: boolean}
        modelFound: {type: boolean}
        models:
          type: array
          items: {type: string}
        message: {type: string}
    PublicRTCSettings:
      type: object
      required: [configured, available, activeProvider, appId, language, mode, secretConfigured, enabled]
      properties:
        configured: {type: boolean}
        available: {type: boolean}
        activeProvider: {type: string, enum: [volcengine, livekit]}
        appId: {type: string}
        language: {type: string}
        mode: {type: string, enum: [production, trial]}
        tokenServiceUrl: {type: string}
        secretConfigured: {type: boolean}
        trialExpiresAt: {type: string, format: date-time}
        trialRoomId: {type: string}
        trialUserId: {type: string}
        volcengineAvailable: {type: boolean}
        livekitUrl: {type: string}
        livekitApiKey: {type: string}
        livekitSecretConfigured: {type: boolean}
        livekitConfigured: {type: boolean}
        livekitAvailable: {type: boolean}
        asrBaseUrl: {type: string}
        asrModel: {type: string}
        asrKeyConfigured: {type: boolean}
        enabled: {type: boolean}
        configVersion: {type: integer}
        updatedAt: {type: string, format: date-time}
        updatedByUsername: {type: string}
    PutRTCSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        appId: {type: string}
        language: {type: string}
        mode: {type: string, enum: [production, trial]}
        tokenServiceUrl: {type: string}
        secret: {type: string, format: password}
        clearSecret: {type: boolean}
        trialExpiresAt: {type: string, format: date-time}
        trialRoomId: {type: string}
        trialUserId: {type: string}
        enabled: {type: boolean}
        activeProvider: {type: string, enum: [volcengine, livekit]}
        livekitUrl: {type: string}
        livekitApiKey: {type: string}
        livekitApiSecret: {type: string, format: password}
        clearLivekitSecret: {type: boolean}
        asrBaseUrl: {type: string}
        asrModel: {type: string}
        asrApiKey: {type: string, format: password}
        clearAsrApiKey: {type: boolean}
        testProvider: {type: string, enum: [volcengine, livekit]}
    RTCTestResult:
      type: object
      required: [reachable, message]
      properties:
        reachable: {type: boolean}
        provider: {type: string}
        message: {type: string}
    RTCConnection:
      type: object
      required: [provider, token, roomId, userId, language, expiresAt]
      properties:
        provider: {type: string, enum: [volcengine, livekit]}
        token: {type: string}
        appId: {type: string}
        url: {type: string}
        roomId: {type: string}
        userId: {type: string}
        language: {type: string}
        expiresAt: {type: string, format: date-time}
    PublicStorageSettings:
      type: object
      required: [configured, available, provider, region, bucket, secretId, secretKeyConfigured, enabled]
      properties:
        configured: {type: boolean}
        available: {type: boolean}
        provider: {type: string}
        region: {type: string}
        bucket: {type: string}
        secretId: {type: string}
        secretKeyConfigured: {type: boolean}
        enabled: {type: boolean}
        configVersion: {type: integer}
        updatedAt: {type: string, format: date-time}
        updatedByUsername: {type: string}
    PutStorageSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        provider: {type: string}
        region: {type: string}
        bucket: {type: string}
        secretId: {type: string}
        secretKey: {type: string, format: password}
        clearSecretKey: {type: boolean}
        enabled: {type: boolean}
    StorageTestResult:
      type: object
      required: [reachable, message]
      properties:
        reachable: {type: boolean}
        message: {type: string}
        buckets:
          type: array
          items:
            type: object
            required: [name, region]
            properties:
              name: {type: string}
              region: {type: string}
    PublicSpeechSettings:
      type: object
      required: [configured, available, ttsAvailable, asrAvailable, appId, speakerId, enabled]
      properties:
        configured: {type: boolean}
        available: {type: boolean}
        ttsAvailable: {type: boolean}
        asrAvailable: {type: boolean}
        activeProvider: {type: string, enum: [volcengine, aliyun]}
        appId: {type: string}
        speakerId: {type: string}
        ttsResourceId: {type: string}
        asrResourceId: {type: string}
        apiKeyConfigured: {type: boolean}
        accessTokenConfigured: {type: boolean}
        secretKeyConfigured: {type: boolean}
        enabled: {type: boolean}
        volcengineAvailable: {type: boolean}
        aliyunAvailable: {type: boolean}
        aliyunAppKey: {type: string}
        aliyunVoice: {type: string}
        aliyunGateway: {type: string}
        aliyunEnabled: {type: boolean}
        aliyunAccessKeyIdConfigured: {type: boolean}
        aliyunAccessKeySecretConfigured: {type: boolean}
        aliyunTokenConfigured: {type: boolean}
        configVersion: {type: integer}
        updatedAt: {type: string, format: date-time}
        updatedByUsername: {type: string}
    ClientSpeechSettings:
      allOf:
        - $ref: '#/components/schemas/PublicSpeechSettings'
        - type: object
          properties:
            apiKey: {type: string, format: password}
            accessToken: {type: string, format: password}
            accessKeyId: {type: string, format: password}
            accessKeySecret: {type: string, format: password}
            aliyunToken: {type: string, format: password}
    PutSpeechSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        appId: {type: string}
        speakerId: {type: string}
        ttsResourceId: {type: string}
        asrResourceId: {type: string}
        enabled: {type: boolean}
        apiKey: {type: string, format: password}
        accessToken: {type: string, format: password}
        secretKey: {type: string, format: password}
        clearApiKey: {type: boolean}
        clearAccessToken: {type: boolean}
        clearSecretKey: {type: boolean}
        activeProvider: {type: string, enum: [volcengine, aliyun]}
        aliyunAppKey: {type: string}
        aliyunVoice: {type: string}
        aliyunGateway: {type: string}
        aliyunEnabled: {type: boolean}
        aliyunAccessKeyId: {type: string, format: password}
        aliyunAccessKeySecret: {type: string, format: password}
        aliyunToken: {type: string, format: password}
        clearAliyunAccessKeyId: {type: boolean}
