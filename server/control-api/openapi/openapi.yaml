openapi: 3.1.0
info:
  title: AI Interviewer Control API
  version: 0.2.0
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Control API is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated browser or desktop session.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: Browser purpose only; control_session with HttpOnly, Secure, SameSite=Strict, and Path=/.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/logout:
    post:
      operationId: logout
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '204':
          description: Current session revoked.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Current public user.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/admin/users:
    get:
      operationId: listAdminUsers
      summary: List users ordered by creation time.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Public user records.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/User'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAdminUser
      summary: Create an administrator or operator. No default operator is seeded.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUserRequest'}
      responses:
        '201':
          description: Created public user.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/UsernameTaken'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/InvalidInputUnprocessable'
  /api/v1/admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    patch:
      operationId: patchAdminUser
      summary: Set user status to active or disabled. Disabling revokes every session.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatchUserRequest'}
      responses:
        '204':
          description: Status updated.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/LastAdminRequired'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/InvalidInputUnprocessable'
  /api/v1/admin/users/{id}/reset-password:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: resetAdminUserPassword
      summary: Replace a password and revoke every session for the target user.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '204':
          description: Password replaced and sessions revoked.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/InvalidInputUnprocessable'
  /api/v1/admin/users/{id}/revoke-sessions:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: revokeAdminUserSessions
      summary: Revoke sessions. preserveCurrent keeps the caller session only when the target is that administrator.
      security:
        - cookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevokeSessionsRequest'}
      responses:
        '204':
          description: Sessions revoked.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: control_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  responses:
    InvalidInput:
      description: Invalid input.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
    InvalidCredentials:
      description: Invalid username or password.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
    Unauthenticated:
      description: Authentication is required.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
          example: {code: UNAUTHENTICATED, message: authentication is required, requestId: request-id}
    RequestTooLarge:
      description: Request body exceeds 32 KiB.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
    RateLimited:
      description: Too many login attempts.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
    Forbidden:
      description: Administrator access is required.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
          example: {code: FORBIDDEN, message: administrator access is required, requestId: request-id}
    UsernameTaken:
      description: Username is already taken.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
          example: {code: USERNAME_TAKEN, message: username is already taken, requestId: request-id}
    LastAdminRequired:
      description: The last active administrator cannot be disabled.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
          example: {code: LAST_ADMIN_REQUIRED, message: the last active administrator cannot be disabled, requestId: request-id}
    UserNotFound:
      description: User was not found.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
          example: {code: USER_NOT_FOUND, message: user was not found, requestId: request-id}
    InvalidInputUnprocessable:
      description: Role, status, username, or password is invalid.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIError'}
          example: {code: INVALID_INPUT, message: request body is invalid, requestId: request-id}
  schemas:
    APIError:
      type: object
      required: [code, message, requestId]
      properties:
        code: {type: string}
        message: {type: string}
        requestId:
          type: string
    User:
      type: object
      required: [id, username, role, status, createdAt, updatedAt]
      properties:
        id: {type: string}
        username: {type: string}
        role: {type: string, enum: [admin, operator]}
        status: {type: string, enum: [active, disabled, deleted]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        lastLoginAt: {type: string, format: date-time}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password, purpose]
      properties:
        username: {type: string}
        password: {type: string, format: password}
        purpose: {type: string, enum: [browser, desktop]}
        deviceId: {type: string}
    LoginResponse:
      type: object
      required: [user, expiresAt]
      properties:
        user: {$ref: '#/components/schemas/User'}
        accessToken:
          type: string
          description: Present only for desktop purpose.
        expiresAt: {type: string, format: date-time}
    HealthResponse:
      type: object
      required: [service, status]
      properties:
        service: {type: string, example: control-api}
        status: {type: string, example: ok}
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, password, role]
      properties:
        username: {type: string}
        password: {type: string, format: password}
        role: {type: string, enum: [admin, operator]}
    PatchUserRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [active, disabled]}
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {type: string, format: password}
    RevokeSessionsRequest:
      type: object
      additionalProperties: false
      properties:
        preserveCurrent: {type: boolean}
