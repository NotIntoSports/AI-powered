name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reject agent ledgers in the published tree
        shell: pwsh
        run: |
          $blocked = @(
            git ls-files '.superpowers' 'docs/superpowers'
          ) | Where-Object { $_ }
          if ($blocked.Count -gt 0) {
            Write-Error ("These paths must stay out of the repo:`n" + ($blocked -join "`n"))
            exit 1
          }
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - run: npm run test:desktop-shell
      - run: npm run test:obs
      - run: npm run build
